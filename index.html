<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ポイントカード</title>

  <!-- CSSを読み込む -->
  <link rel="stylesheet" href="style.css">

  <!-- JavaScriptを読み込む -->
  <script src="app.js" defer></script>
  <script type="module" src="firebase.js"></script>
</head>
<body>

  <div class="card">
    <h1>SHOP POINT CARD</h1>

    <p>10ポイントで特典プレゼント！</p>

    <div id="stampArea" class="stamp-area"></div>

    <p id="pointDisplay">現在のポイント：0</p>

    <button id="addButton">ポイントを貯める</button>
    <p id="firebaseStatus">Firebase接続待ち</p>
  </div>

</body>
</html>
