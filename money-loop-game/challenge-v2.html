let state=null;let ui={page:'home',step:0,profession:'teacher',dream:'atelier',difficulty:'standard',practice:'',panel:null,diceCount:1,animating:false,lastRoll:[],toastTimer:null};
function f(n){return (Math.round((Number(n)||0)*100)/100).toLocaleString('ja-JP',{maximumFractionDigits:2});}
function usd(n){return '$'+f(n)}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function byId(id,list){return list.find(x=>x.id===id)}
function rand(list){return list[Math.floor(Math.random()*list.length)]}
function challenge(){return !!state&&state.difficulty==='challenge'}
function loanRelief(a){return a.type==='stock'?0:roundAsset(Math.max(0,(a.originalMortgage??a.mortgage)-a.mortgage)*0.0008)}
function assetIncome(a){if(a.type==='stock')return a.qty*a.dividend;let x=a.cf+loanRelief(a);if(challenge()&&a.type==='property'&&a.vacancy>0)x-=Math.max(250,Math.round(Math.abs(a.cf)*1.7));if(challenge()&&a.type==='business'&&a.slump>0)x-=Math.max(100,Math.round(Math.abs(a.cf)*0.5));return roundAsset(x)}
function canEscape(){return !!state&&state.stage==='rat'&&income()>costs()&&(!challenge()||state.money>=costs()*2)}
function refreshEscape(){if(!state||state.stage!=='rat'||state.event)return;let x=canEscape();if(x&&!state.readyEscape)log('ラットレースの脱出条件を満たしました。');state.readyEscape=x}
function challengeStatus(){if(!challenge()||state.stage!=='rat')return '';let v=state.assets.filter(a=>a.vacancy>0).length,b=state.assets.filter(a=>a.slump>0).length;return '<div class="note mt12"><b style="color:var(--gold)">実戦モード｜資金管理</b><div class="flex mt8"><span>生活防衛資金（2か月分）</span><strong>'+usd(Math.ceil(costs()*2))+'</strong></div><div class="flex mt8"><span>現在の現金</span><strong>'+usd(state.money)+'</strong></div><div class="flex mt8"><span>物価上昇</span><strong>+'+f((state.inflation||0)*100)+'%</strong></div><div class="flex mt8"><span>空室／売上不振</span><strong>'+v+'件／'+b+'件</strong></div><div class="tiny mt8">脱出には不労所得が総支出を超え、さらに現金が生活防衛資金以上ある必要があります。</div></div>'}
function challengePayday(){
if(!challenge()||state.stage!=='rat')return;
state.paydays=(state.paydays||0)+1;
state.assets.forEach(a=>{if(a.vacancy>0)a.vacancy--;if(a.slump>0)a.slump--;});
if(state.paydays%4===0){state.inflation=roundAsset(Math.min(0.3,(state.inflation||0)+0.02));log('物価上昇：その他の生活費が累計'+f(state.inflation*100)+'%増加。')}
let p=state.assets.filter(a=>a.type==='property'&&!a.vacancy);
if(p.length&&Math.random()<.26){let a=rand(p);a.vacancy=2;log(a.name+' が空室に。給料日2回分の収入が減少します。')}
let b=state.assets.filter(a=>a.type==='business'&&!a.slump);
if(b.length&&Math.random()<.18){let a=rand(b);a.slump=2;log(a.name+' の売上不振。給料日2回分の収入が減少します。')}
let owned=state.assets.filter(a=>a.type==='property');
if(owned.length&&Math.random()<.17){let cost=Math.min(2500,Math.round(300+owned.reduce((v,a)=>v+a.cost,0)*.008));payMandatory(cost,'緊急修繕費')}
}
function repayProperty(id){
if(!state||state.stage!=='rat')return;
const a=state.assets.find(x=>x.id===id&&x.type!=='stock');const v=Number(document.getElementById('prop-pay-'+id)?.value);
if(!a||!Number.isSafeInteger(v)||v<1000||v%1000){toast('$1,000単位で入力してください');return}
if(v>a.mortgage||v>state.money){toast('借入残高か現金が不足しています');return}
if(a.originalMortgage===undefined)a.originalMortgage=a.mortgage;
a.mortgage-=v;state.money-=v;log(a.name+'の借入元金'+usd(v)+'を返済。月収益+'+usd(v*.0008));refreshEscape();saved();render();ui.panel='bank';renderOverlay();toast('物件ローンを返済しました')
}
function income(){return state?roundAsset(state.assets.reduce((n,a)=>n+assetIncome(a),0)):0}
function costs(){if(!state)return 0;let p=byId(state.profession,PROF),r=p.expenses;return r.tax+roundAsset(r.other*(1+(challenge()?(state.inflation||0):0)))+(state.debts.home>0?r.home:0)+(state.debts.school>0?r.school:0)+(state.debts.car>0?r.car:0)+(state.debts.card>0?r.card:0)+state.debts.bank*.1+state.children*p.kidCost;}
function total(){return (state?byId(state.profession,PROF).salary:0)+income()}
function cashflow(){return total()-costs()}
function ftFlow(){return state.ftBase+state.ftBusinesses.reduce((n,i)=>n+FAST[i].cf,0)}

function renderBoard(){let pad=50,rt=41,ri=27;let circles=`<div class="ring outer"></div><div class="ring inner"></div>`;let spaces=FAST.map((s,i)=>{let angle=-Math.PI/2+2*Math.PI*i/FAST.length;let left=50+rt*Math.cos(angle),top=50+rt*Math.sin(angle),cls=`outer ${s.type} ${state.stage==='rat'?'dimmed':''} ${state.stage==='fast'&&state.pos===i?'active':''} ${state.ftBusinesses.includes(i)?'bought':''}`;return `<div class="space ${cls}" style="left:${left}%;top:${top}%" aria-label="外側 ${esc(s.name)}" title="${esc(s.name)}"><span>${s.icon}</span><em>${esc(s.name)}</em></div>`}).join('');spaces+=RAT.map((s,i)=>{let a=-Math.PI/2+2*Math.PI*i/RAT.length;return `<div class="space inner ${s[0]} ${state.stage==='fast'?'dimmed':''} ${state.stage==='rat'&&state.pos===i?'active':''}" style="left:${50+ri*Math.cos(a)}%;top:${50+ri*Math.sin(a)}%" aria-label="内側 ${esc(s[1])}" title="${esc(s[1])}"><span>${s[2]}</span><em>${esc(s[1])}</em></div>`}).join('');let circleTitle=state.stage==='rat'?'RAT RACE':'FAST TRACK',dices=ui.lastRoll.length?ui.lastRoll.map(x=>`<span>${x}</span>`).join(' + '):'↗';return `<div class="board-panel"><div class="board-label">OUTER TRACK · INNER TRACK</div><div class="board">${circles}${spaces}<div class="board-center"><div class="dice-big">${dices}</div><b>${circleTitle}</b><small>${state.stage==='rat'?'不労所得を育てる':'夢に向かって進む'}</small></div></div><div class="board-help">金色の枠が現在地 · 外周は上級ステージ</div></div>`}
function playing(){let p=byId(state.profession,PROF),pass=income(),ex=costs(),cf=cashflow(),pct=ex>0?Math.min(100,Math.max(0,pass/ex*100)):100,fast=state.stage==='fast',canRoll=!state.event&&!ui.animating&&!state.readyEscape;return header(`<span class="stage-tag ${fast?'fast':''}">${fast?'上級ステージ':'ラットレース'}</span>`)+`<div class="flex" style="margin:5px 2px 12px"><div><div class="eyebrow">TURN ${state.turns+1}</div><div style="font-size:21px;font-weight:900;margin-top:3px">${fast?'夢の実現へ':'お金の流れを変える'}</div></div><span class="pill ${fast?'gold-pill':''}">${esc(p.name)}</span></div><section class="dashboard"><div class="stat"><div class="stat-label">手元の現金</div><div class="stat-value mono">${usd(state.money)}</div><div class="stat-sub">すぐに使えるお金</div></div><div class="stat"><div class="stat-label">${fast?'上級ステージの収入':'毎月の手残り'}</div><div class="stat-value mono ${fast?'gold':cf>=0?'good':'bad'}">${usd(fast?ftFlow():cf)}</div><div class="stat-sub">${fast?'収入日を通過すると受取':'総収入 − 総支出'}</div></div><div class="stat"><div class="stat-label">${fast?'追加した事業収入':'毎月の不労所得'}</div><div class="stat-value mono good">${usd(fast?ftFlow()-state.ftBase:pass)}</div><div class="stat-sub">${fast?'勝利目標 +$50,000':'持っている資産から得る収入'}</div></div><div class="stat"><div class="stat-label">${fast?'初期の上級収入':'毎月の総支出'}</div><div class="stat-value mono">${usd(fast?state.ftBase:ex)}</div><div class="stat-sub">${fast?'前ステージの成果を換算':'生活費＋負債の支払い'}</div></div></section><div class="goal-progress"><div class="flex"><span>${fast?'事業収入の達成率':'ラットレース脱出まで'}</span><b class="${fast?'gold':'good'}">${f(fast?(ftFlow()-state.ftBase)/50000*100:pct)}%</b></div><div class="bar"><i style="width:${fast?Math.max(0,Math.min(100,(ftFlow()-state.ftBase)/50000*100)):pct}%"></i></div><div class="flex mt8"><span>${fast?'あと '+usd(Math.max(0,50000-(ftFlow()-state.ftBase))):challenge()?'収入・現金2か月分の条件を達成':'不労所得が支出を超えれば脱出'}</span>${!fast?`<b>${usd(Math.max(0,ex-pass))} 差</b>`:''}</div></div>${challengeStatus()}${renderBoard()}<section class="action-box"><div class="turn-label">${state.event?'EVENT IN PROGRESS':state.readyEscape?'CONGRATULATIONS':state.skipTurns>0?'TURN SKIP':'YOUR TURN'}</div><div class="action-title">${state.readyEscape?'経済的自由への入口が開いた！':state.event?'イベントを処理しよう':state.skipTurns>0?'失業中：残り'+state.skipTurns+'回':fast?'投資か、夢か。次の一手を。':'次はどんな出来事が起こる？'}</div><div class="action-desc">${state.readyEscape?'次のステージに進めます。ラットレースの現金は上級ステージの初期資金に切り替わります。':state.event?'画面下のカードで購入・支払いなどの処理を終えてください。':state.skipTurns>0?'次の手番はサイコロを振らず、1回休みます。':'サイコロの数を選び、振って進みましょう。'}</div>${!state.readyEscape&&!state.event?`<div class="dice-controls">${Array.from({length:fast?(state.ftDice3?3:2):(state.charityTurns>0?2:1)},(_,i)=>`<button class="dice-choice ${ui.diceCount===i+1?'selected':''}" data-action="dice-count" data-num="${i+1}">${i+1}個</button>`).join('')}<div style="flex:1"></div><div class="die">${ui.lastRoll[0]||'⚄'}</div>${ui.lastRoll[1]?`<div class="die">${ui.lastRoll[1]}</div>`:''}${ui.lastRoll[2]?`<div class="die">${ui.lastRoll[2]}</div>`:''}</div>`:''}<button class="primary mt12" ${ui.animating?'disabled':''} data-action="${state.readyEscape?'promote':state.event?'show-event':state.skipTurns>0?'skip-turn':'roll'}">${state.readyEscape?'上級ステージへ進む →':state.event?'イベントを開く':state.skipTurns>0?'1ターン休む':ui.animating?'サイコロを振っています…':'🎲 サイコロを振る'}</button></section><nav class="toolbar"><button class="tool-btn" data-action="finance"><b>▤</b>財務</button><button class="tool-btn" data-action="bank"><b>⌁</b>銀行</button><button class="tool-btn" data-action="logs"><b>◷</b>記録</button><button class="tool-btn" data-action="menu"><b>☷</b>設定</button></nav><div class="footer-note">ゲーム内容は架空の数値による金融教育シミュレーションです。<br>実際の投資判断には利用しないでください。</div>`}
function won(){return header()+`<div class="celebration"><div class="medal">🏆</div><div class="eyebrow">GOAL ACHIEVED</div><h1>おめでとう！<br>あなたの勝利。</h1><p class="bodycopy">${esc(state.wonReason)}</p><div class="card mt20"><div class="data-row"><span>プレイしたターン</span><b>${state.turns} ターン</b></div><div class="data-row"><span>最後の現金</span><b>${usd(state.money)}</b></div><div class="data-row"><span>上級ステージ追加収入</span><b>${usd(ftFlow()-state.ftBase)}</b></div><div class="data-row"><span>選んだ夢</span><b>${esc(byId(state.dream,DREAMS).name)}</b></div></div><div class="note mt20">このゲームで増やすべきは手元のお金だけではなく、収入を生み続ける仕組みでした。もう一度、別の職業から試してみよう。</div><button class="primary mt20" data-action="setup">違う人生で再挑戦</button><button class="secondary mt8" data-action="logs">ゲームの記録を見る</button></div>`}
function render(){let root=document.getElementById('app');root.innerHTML=ui.page==='home'?home():ui.page==='tutorial'?tutorial():ui.page==='setup'?setup():ui.page==='playing'&&state?playing():ui.page==='won'&&state?won():home();renderOverlay()}
function closePanel(){ui.panel=null;renderOverlay()}
function openPanel(type){ui.panel=type;renderOverlay()}
function renderOverlay(){let target=document.getElementById('overlay-root');let panel=ui.panel;if(panel){target.innerHTML=`<div class="overlay" role="presentation"><div class="sheet" role="dialog" aria-modal="true">${renderPanel(panel)}</div></div>`;return}if(state&&(ui.page==='playing'||ui.page==='won')&&state.event){target.innerHTML=`<div class="overlay" role="presentation"><div class="sheet" role="dialog" aria-modal="true">${renderEvent(state.event)}</div></div>`;return}target.innerHTML=''}
function sheetHead(title,kicker=''){return `<div class="sheet-head"><div class="deal-badge">${kicker}</div><button class="close-btn" data-action="close-panel">閉じる ×</button></div><h2>${title}</h2>`}
function dataRow(label,v,css=''){return `<div class="data-row ${css}"><span>${label}</span><b class="mono">${v}</b></div>`}
function renderPanel(type){if(type==='finance'&&state.stage==='fast'){return sheetHead('上級ステージの財務','FAST TRACK FINANCES')+`<div class="note">このステージでは、ラットレースの給料・生活費・借入は使用しません。上級ステージの収入日額と購入した事業を管理します。</div>${dataRow('手元の現金',usd(state.money),'highlight')}${dataRow('スタート時の収入日額',usd(state.ftBase))}${dataRow('購入事業の追加月間収入',usd(ftFlow()-state.ftBase))}${dataRow('現在の収入日額',usd(ftFlow()),'highlight')}<h3>購入した事業</h3>${state.ftBusinesses.length?state.ftBusinesses.map(i=>`<div class="owned-item"><div><strong>${esc(FAST[i].title)}</strong><small>購入費 ${usd(FAST[i].cost)} · 月間収入 +${usd(FAST[i].cf)}</small></div></div>`).join(''):'<p class="bodycopy">追加事業はまだありません。</p>'}<h3>夢の実現</h3>${DREAMS.map(d=>dataRow(d.name,state.ownedDreams.includes(d.id)?'実現済み':usd(d.price))).join('')}<h3>ラットレース脱出時</h3>${dataRow('脱出時の不労所得',usd(state.ratSnapshot?.passive||0))}${dataRow('脱出時の毎月の総支出',usd(state.ratSnapshot?.expenses||0))}`;}if(type==='rules')return sheetHead('遊び方とルール','HOW TO PLAY')+`<div class="rule-section"><h3>1｜お金の動き</h3><p class="bodycopy">毎月の手残り ＝ 給料 ＋ 不労所得 − 毎月の支出。手元の現金は、投資の頭金・ローンの返済・臨時支出によって増減します。</p></div><div class="rule-section"><h3>2｜ラットレース</h3><p class="bodycopy">1個のサイコロで進みます。投資マスでは小口か大型の投資カードを選択できます。給料日マスを踏むか通ると、その時点の毎月の手残りを受け取ります。</p></div><div class="rule-section"><h3>3｜投資カードとROI</h3><p class="bodycopy">不動産・事業は頭金を支払い、ローン残高と毎月の不労所得を記録します。ROIの目安は「毎月の収益 × 12 ÷ 頭金」。株式は単価と保有株数を選択し、市場イベントで売却します。株式は配当がある銘柄だけが不労所得を増やします。</p></div><div class="rule-section"><h3>4｜銀行借入と返済</h3><p class="bodycopy">ラットレースでは $1,000 単位で銀行から借入できます。借入額の10%が毎月の支出に加わります。実戦モードでは銀行からの新規借入に上限があります。投資物件の元金は銀行画面から個別に返済できます。銀行ローンは $1,000 単位、その他の個人ローンは全額を返済できます。</p></div><div class="rule-section"><h3>5｜特別イベント</h3><p class="bodycopy">臨時支出は必須です。寄付では総収入の10%を支払うと次の3手番、最大2個のサイコロを選べます。子どもの誕生は最大3人まで月額支出を増やします。失業は毎月の総支出を支払い、2ターン休みです。</p></div><div class="rule-section"><h3>6｜脱出と勝利</h3><p class="bodycopy">不労所得が総支出を上回ると、次の手番に上級ステージへ移動できます。そこで「自分の夢」を購入するか、追加の事業収入を月 $50,000 増やすと勝利。上級ステージは通常サイコロ2個で、銀行から借入できません。</p></div><div class="rule-section"><h3>7｜実戦モード</h3><p class="bodycopy">初期貯蓄は60%。給料日ごとに空室・売上減少・緊急修繕が起こる可能性があります。給料日4回ごとにその他生活費は2%増加。銀行の任意借入上限は月給4か月分。不労所得が支出を上回り、現金2か月分があると脱出できます。すべて独自の簡略ルールです。</p></div><div class="note mt12">この作品は1人で学ぶための独立したオリジナル版です。元のボードゲームの全カード・盤面の位置・対人交渉・倒産処理などは完全には再現していません。</div>`;
if(type==='finance'){let p=byId(state.profession,PROF),e=p.expenses;let owner=state.assets;return sheetHead('財務諸表','INCOME STATEMENT')+`<div class="pill">${esc(p.name)} · ${state.stage==='fast'?'上級ステージ':'ラットレース'}</div><h3>収入</h3>${dataRow('労働収入（給料）',usd(p.salary))}${dataRow('不労所得（投資収入）',usd(income()))}${dataRow('総収入',usd(total()),'highlight')}<h3>支出</h3>${dataRow('税金',usd(e.tax))}${dataRow('住宅ローン',usd(state.debts.home?e.home:0))}${dataRow('教育ローン',usd(state.debts.school?e.school:0))}${dataRow('自動車ローン',usd(state.debts.car?e.car:0))}${dataRow('カード返済',usd(state.debts.card?e.card:0))}${dataRow('その他の生活費',usd(e.other))}${dataRow(`子ども関連（${state.children}人）`,usd(state.children*p.kidCost))}${dataRow('銀行借入の利息（月10%）',usd(state.debts.bank*.1))}${dataRow('総支出',usd(costs()),'highlight')}${dataRow('毎月の手残り',usd(cashflow()),'highlight')}<h3>資産</h3>${owner.length?owner.map(a=>`<div class="owned-item"><div><strong>${esc(a.name)}</strong><small>${a.type==='stock'?`${a.qty}株 · 取得単価 ${usd(a.buyPrice)} · 月配当 ${usd(a.qty*a.dividend)}`:`取得総額 ${usd(a.cost)} · 頭金 ${usd(a.down)} · 借入 ${usd(a.mortgage)} · 現在の月収益 ${usd(assetIncome(a))}`}</small></div></div>`).join(''):'<p class="bodycopy">投資による資産はまだありません。</p>'}<h3>負債</h3>${dataRow('住宅ローン残高',usd(state.debts.home))}${dataRow('教育ローン残高',usd(state.debts.school))}${dataRow('自動車ローン残高',usd(state.debts.car))}${dataRow('カード残高',usd(state.debts.card))}${dataRow('銀行借入残高',usd(state.debts.bank))}${dataRow('投資物件の借入残高',usd(owner.filter(a=>a.type!=='stock').reduce((s,a)=>s+a.mortgage,0)))}${state.stage==='fast'?`<h3>上級ステージの記録</h3>${dataRow('スタート時の収入日額',usd(state.ftBase))}${dataRow('追加事業収入',usd(ftFlow()-state.ftBase))}${dataRow('現在の収入日額',usd(ftFlow()),'highlight')}`:''}<button class="soft mt16" data-action="bank">借入・返済を確認</button>`}
if(type==='bank'){if(state.stage==='fast')return sheetHead('銀行','BANK')+`<div class="note">上級ステージでは新規の銀行借入はできません。ラットレースでの資産・ローンは上級ステージ移行時に精算済みとして扱います。</div>`;return sheetHead('銀行：借りる・返す','BANK & LIABILITIES')+`<div class="note">借りたお金は現金が増えますが、借入額の10%が毎月の支出に追加されます。借りるだけでは豊かになりません。</div><h3>借入をする</h3><label for="loan-amount" class="bodycopy">借入額（$1,000 単位）</label><input class="input" id="loan-amount" type="number" min="1000" step="1000" value="1000" inputmode="numeric"><button class="primary" data-action="borrow">指定額を借りる</button><h3>銀行借入を返済する</h3>${dataRow('銀行ローン残高',usd(state.debts.bank))}<label for="repay-amount" class="bodycopy">返済額（$1,000 単位）</label><input class="input" id="repay-amount" type="number" min="1000" step="1000" value="1000" inputmode="numeric"><button class="secondary" data-action="repay-bank" ${state.debts.bank===0?'disabled':''}>指定額を返済する</button><h3>その他の負債を全額返済する</h3>${[['home','住宅ローン'],['school','教育ローン'],['car','自動車ローン'],['card','カード残高']].map(([id,name])=>`<div class="owned-item"><div><strong>${name}</strong><small>残高 ${usd(state.debts[id])}</small></div><button class="soft" data-action="repay-debt" data-id="${id}" ${!state.debts[id]||state.money<state.debts[id]?'disabled':''}>全額返済</button></div>`).join('')}<h3>投資物件・事業の借入元金を返済</h3><p class="bodycopy">元金を$1,000返済すると月収益が約$0.80増える、独自の簡略ルールです。借入元金は自動では減りません。</p>${state.assets.filter(a=>a.type!=='stock').map(a=>`<div class="owned-item" style="display:block"><strong>${esc(a.name)}</strong><small style="display:block">借入残高 ${usd(a.mortgage)} · 現在の月収益 ${usd(assetIncome(a))}</small><label for="prop-pay-${esc(a.id)}" class="tiny">返済額（$1,000単位）</label><input class="input" id="prop-pay-${esc(a.id)}" type="number" min="1000" step="1000" value="1000" inputmode="numeric"><button class="soft mt8" data-action="repay-property" data-id="${esc(a.id)}" ${a.mortgage<1000||state.money<1000?'disabled':''}>物件ローンを返済</button></div>`).join('')||'<div class="note">返済対象の投資ローンはありません。</div>'}<div class="hint">現在の現金 ${usd(state.money)}。現金を返済に回すか、次の投資に使うか判断しよう。</div>`}
if(type==='logs')return sheetHead('これまでの行動','GAME LOG')+(state.log.length?state.log.map(x=>`<div class="log-entry"><time>${x.stage==='fast'?'上級':'内側'} ${x.t}手</time>${esc(x.msg)}</div>`).join(''):'<p class="bodycopy">まだ記録がありません。</p>');
if(type==='menu')return sheetHead('ゲーム設定','SETTINGS')+`<div class="note">この端末のブラウザに自動保存されています。同じ端末・同じブラウザで開いてください。プライベートブラウズやデータ消去で記録が消える場合があります。</div><div class="stack mt16"><button class="secondary" data-action="rules">ルール一覧</button><button class="secondary" data-action="home">ホーム画面へ（セーブを残す）</button><button class="danger" data-action="restart">今のゲームを削除して最初から</button></div>`;
return sheetHead('詳細','INFO')}
function renderEvent(ev){let h=`<div class="sheet-head"><span class="deal-badge">${ev.type==='deal'?'INVESTMENT OPPORTUNITY':'BOARD EVENT'}</span><span class="pill">${state.stage==='fast'?'上級':'ラットレース'} · ${state.turns}手</span></div>`;
if(ev.type==='pick')return h+`<h2>投資のチャンス！</h2><p class="bodycopy">引くカードを選んでください。選んだカードの内容を見てから、購入するか見送るかを決められます。</p><div class="stack mt16"><button class="primary" data-action="draw-deal" data-deck="small">小口の投資（頭金 $5,000 以下）</button><button class="secondary" data-action="draw-deal" data-deck="big">大型の投資（頭金 $6,000 以上）</button><button class="secondary" data-action="dismiss-event">今回は投資しない</button></div>`;
if(ev.type==='deal'){let d=ev.deal,isStock=d.type==='stock',roi=!isStock&&d.down?d.cf*12/d.down*100:null;return h+`<h2>${esc(d.name)}</h2><span class="pill">${isStock?'株式':d.type==='property'?'不動産':'事業'} · ${ev.deck==='small'?'小口投資':'大型投資'}</span><div class="event-summary"><strong>${isStock?'株価 '+usd(d.price):'頭金 '+usd(d.down)}</strong><small>${esc(d.detail)}</small><div class="numbers">${isStock?`<div><div class="small-label">1株の価格</div><b>${usd(d.price)}</b></div><div><div class="small-label">1株の月配当</div><b class="good">${usd(d.dividend)}</b></div>`:`<div><div class="small-label">購入総額</div><b>${usd(d.cost)}</b></div><div><div class="small-label">借入金（物件/事業）</div><b>${usd(d.cost-d.down)}</b></div><div><div class="small-label">月間キャッシュフロー</div><b class="${d.cf>=0?'good':'bad'}">${usd(d.cf)}</b></div><div><div class="small-label">年間ROIの目安</div><b>${f(roi)}%</b></div>`}</div></div>${isStock?`<label for="stock-qty" class="bodycopy">購入する株数を入力してください（1株以上）</label><input id="stock-qty" class="input" type="number" value="100" min="1" step="1" inputmode="numeric"><div class="hint">配当合計＝株数 × 1株の月配当。市場イベントで売却できます。</div>`:`<div class="hint">頭金は現金から支払い、投資物件の借入額は負債として記録します。カード記載の月収益は借入返済を織り込んだ純収益です。</div>`}<div class="button-row"><button class="secondary" data-action="dismiss-event">見送る</button><button class="primary" data-action="buy-deal">${isStock?'指定株数を買う':'投資する'}</button></div><button class="soft mt8" data-action="bank">銀行で借入・返済する</button><div class="tiny mt8">現在の現金 ${usd(state.money)}。銀行へ移動してもこの投資機会は残ります。</div>`}
if(ev.type==='bill')return h+`<h2>予定外の支出</h2><div class="event-summary"><strong>${esc(ev.name)}</strong><p class="bodycopy">${esc(ev.detail)}</p><div class="numbers"><div><div class="small-label">必要な支払い</div><b class="bad">−${usd(ev.amount)}</b></div><div><div class="small-label">手元の現金</div><b>${usd(state.money)}</b></div></div></div><div class="hint">これは必ず支払うイベントです。現金が不足するときは不足額を $1,000 単位で借り入れて支払います。</div><button class="primary" data-action="pay-bill">${state.money<ev.amount?'不足分を借り入れて支払う':'支払う'}</button>`;
if(ev.type==='charity')return h+`<h2>寄付の選択</h2><p class="bodycopy">総収入の10%を寄付すると、次の3回の手番でサイコロ1個または2個を選べます。</p>${dataRow('今回の寄付額',usd(Math.round(total()*.1)),'highlight')}<div class="button-row"><button class="secondary" data-action="dismiss-event">寄付しない</button><button class="primary" data-action="donate" ${state.money<Math.round(total()*.1)?'disabled':''}>寄付する</button></div>`;
if(ev.type==='notice')return h+`<h2>${esc(ev.title)}</h2><p class="bodycopy">${esc(ev.body)}</p>${ev.extra?`<div class="note">${esc(ev.extra)}</div>`:''}<button class="primary mt16" data-action="dismiss-event">確認して進む</button>`;
if(ev.type==='market')return h+`<h2>市場の動き</h2><div class="event-summary"><strong>${esc(ev.card.name)}</strong><p class="bodycopy">${esc(ev.card.detail)}</p><span class="pill gold-pill">参考売値倍率 ${f(ev.card.multiple)} 倍</span></div><p class="bodycopy">この市場カードに対応する資産だけ売却できます。売却しない判断も可能です。</p>${marketOptions(ev.card)}<button class="secondary mt12" data-action="dismiss-event">市場イベントを終了</button>`;
if(ev.type==='fastbiz'){let b=FAST[ev.index],isOwned=state.ftBusinesses.includes(ev.index);return h+`<h2>${esc(b.title)}</h2><div class="event-summary"><strong>${usd(b.cost)}</strong><small>上級ステージの新規事業</small><div class="numbers"><div><div class="small-label">購入費</div><b>${usd(b.cost)}</b></div><div><div class="small-label">追加の月間収入</div><b class="good">+${usd(b.cf)}</b></div></div></div><div class="hint">上級ステージは銀行借入ができません。毎回の収入日を活用して自己資金を増やしましょう。</div><div class="button-row"><button class="secondary" data-action="dismiss-event">見送る</button><button class="primary" data-action="buy-fast" ${isOwned||state.money<b.cost?'disabled':''}>${isOwned?'購入済み':'購入する'}</button></div>`}
if(ev.type==='dream'){let d=byId(ev.dream,DREAMS),isMine=d.id===state.dream,isOwned=state.ownedDreams.includes(d.id);return h+`<h2>夢に近づく。</h2><div class="event-summary"><strong>${esc(d.name)}</strong><p class="bodycopy">${esc(d.desc)}</p><div class="numbers"><div><div class="small-label">購入するための現金</div><b>${usd(d.price)}</b></div><div><div class="small-label">あなたが選んだ夢？</div><b>${isMine?'YES':'ほかの夢'}</b></div></div></div><p class="bodycopy">${isMine?'この夢を買うことができれば、ゲームに勝利します。':'別の夢も購入できますが、勝利条件を満たすのは最初に選んだ夢です。'}</p><div class="button-row"><button class="secondary" data-action="dismiss-event">見送る</button><button class="primary" data-action="buy-dream" ${isOwned||state.money<d.price?'disabled':''}>${isOwned?'購入済み':'夢を購入する'}</button></div>`}
if(ev.type==='fastcharity')return h+`<h2>寄付で選択肢を増やす</h2><p class="bodycopy">$100,000 を寄付すると、これ以降の手番でサイコロを1・2・3個から自由に選べます。</p><div class="button-row"><button class="secondary" data-action="dismiss-event">寄付しない</button><button class="primary" data-action="fast-donate" ${state.money<100000||state.ftDice3?'disabled':''}>${state.ftDice3?'寄付済み':'寄付する'}</button></div>`;
return h+`<h2>イベント</h2><button class="primary" data-action="dismiss-event">続ける</button>`}
function marketOptions(card){
  const eligible=state.assets.filter(a=>{
    if(card.type==='stock')return a.type==='stock';
    if(card.type==='business')return a.type==='business';
    return a.type==='property'&&(card.sector==='all'||a.sector===card.sector);
  });
  if(!eligible.length)return '<div class="note">売却できる対象の資産を持っていません。市場の変化を学び、次の機会を待ちましょう。</div>';
  return eligible.map(a=>{
    const pricePerShare=a.type==='stock'?Math.max(.01,roundAsset(a.buyPrice*card.multiple)):0;
    const sale=a.type==='stock'?pricePerShare*a.qty:Math.round(a.cost*card.multiple);
    const proceeds=a.type==='stock'?sale:sale-a.mortgage;
    return `<div class="owned-item"><div style="min-width:0;flex:1"><strong>${esc(a.name)}</strong><small>${a.type==='stock'?`${a.qty}株保有・売却単価 ${usd(pricePerShare)}`:`売却額 ${usd(sale)} − 物件借入 ${usd(a.mortgage)}`}<br>全て売った場合の現金増減 <span class="${proceeds>=0?'good':'bad'}">${proceeds>=0?'+':''}${usd(proceeds)}</span></small>${a.type==='stock'?`<label class="tiny" for="sale-${a.id}">売る株数（1〜${a.qty}）</label><input class="input" style="padding:8px;margin-bottom:2px" id="sale-${a.id}" type="number" value="${a.qty}" min="1" max="${a.qty}" step="1" inputmode="numeric">`:''}</div><button class="soft" data-action="sell-market" data-id="${esc(a.id)}" ${state.money+proceeds<0&&a.type!=='stock'?'disabled':''}>売却</button></div>`;
  }).join('');
}
function completeEvent(){state.event=null;refreshEscape();saved();render()}
function notice(title,body,extra=''){state.event={type:'notice',title,body,extra};saved();render()}
function payMandatory(amount,label){if(state.money<amount){let loan=Math.ceil((amount-state.money)/1000)*1000;state.debts.bank+=loan;state.money+=loan;log(`必須の支払いのため銀行から ${usd(loan)} 借りた。`)}state.money=roundAsset(state.money-amount);log(`${label}：${usd(amount)} 支払った。`)}
async function roll(){if(!state||ui.animating||state.event||state.readyEscape||state.skipTurns>0||ui.page!=='playing')return;ui.animating=true;let num=Math.min(ui.diceCount||1,state.stage==='fast'?(state.ftDice3?3:2):(state.charityTurns>0?2:1));let rolls=Array.from({length:num},()=>1+Math.floor(Math.random()*6)),sum=rolls.reduce((a,b)=>a+b,0),s=state.stage==='rat'?RAT:FAST;state.turns++;ui.lastRoll=rolls;render();for(let step=0;step<sum;step++){await new Promise(r=>setTimeout(r,85));state.pos=(state.pos+1)%s.length;if(state.stage==='rat'&&RAT[state.pos][0]==='payday'){if(challenge())challengePayday();let payday=roundAsset(cashflow());state.money=roundAsset(state.money+payday);log(`給料日：毎月の手残り ${usd(payday)} ${payday<0?'支払い':'受け取り'}。`)}if(state.stage==='fast'&&FAST[state.pos].type==='cfday'){let payday=ftFlow();state.money+=payday;log(`上級ステージ収入日：${usd(payday)} を受け取った。`)}document.querySelectorAll('.space.active').forEach(x=>x.classList.remove('active'));let spaces=document.querySelectorAll(state.stage==='rat'?'.space.inner':'.space.outer');spaces[state.pos]?.classList.add('active')}
ui.animating=false;let stage=state.stage;if(stage==='rat'&&state.charityTurns>0)state.charityTurns--;if(stage==='rat'){let type=RAT[state.pos][0];if(type==='opp')state.event={type:'pick'};else if(type==='market')state.event={type:'market',card:{...rand(MARKETS)}};else if(type==='bill'){let b=rand(BILLS);state.event={type:'bill',name:b[0],amount:challenge()?Math.round(b[1]*1.35):b[1],detail:b[2]}}else if(type==='charity')state.event={type:'charity'};else if(type==='baby'){if(state.children<3){state.children++;log(`家族が増えた。毎月の支出が ${usd(byId(state.profession,PROF).kidCost)} 増えた。`);state.event={type:'notice',title:'家族が増えました',body:`子どもが${state.children}人になり、毎月の支出が ${usd(byId(state.profession,PROF).kidCost)} 増加しました。`}}else state.event={type:'notice',title:'家族イベント',body:'子どもの人数は上限の3人です。今回は支出の変化はありません。'}}else if(type==='downsized'){payMandatory(costs(),'失業による生活費');state.skipTurns=2;state.charityTurns=0;state.event={type:'notice',title:'一時的な失業',body:'毎月の総支出を現金から払い、次の2手番はサイコロを振れません。寄付のサイコロ効果も終了します。'}}}
else{let sp=FAST[state.pos];if(sp.type==='biz')state.event={type:'fastbiz',index:state.pos};else if(sp.type==='dream')state.event={type:'dream',dream:sp.dream};else if(sp.type==='charity')state.event={type:'fastcharity'};else if(sp.type==='loss'){let amount=sp.loss==='all'?state.money:Math.floor(state.money/2);state.money-=amount;log(`${sp.name}：${usd(amount)} を失った。`);state.event={type:'notice',title:`予想外の出来事：${sp.name}`,body:`手元の現金から ${usd(amount)} がなくなりました。上級ステージでもリスクに備える必要があります。`}}}
log(`サイコロ ${rolls.join(' + ')} = ${sum}。${stage==='rat'?RAT[state.pos][1]:FAST[state.pos].name}マスに到着。`);refreshEscape();saved();render()}
function buyDeal(){if(!state.event||state.event.type!=='deal')return;let d=state.event.deal;if(d.type==='stock'){let qty=Number(document.getElementById('stock-qty')?.value),price=qty*d.price;if(!Number.isInteger(qty)||qty<1||qty>1000000){toast('購入株数を正しく入力してください');return}if(state.money<price){toast('現金が不足しています。銀行から借入できます');return}state.money=roundAsset(state.money-price);let asset=state.assets.find(a=>a.type==='stock'&&a.symbol===d.symbol&&a.buyPrice===d.price&&a.dividend===d.dividend);if(asset)asset.qty+=qty;else state.assets.push({id:'s'+Date.now()+Math.random().toString(36).slice(2,6),type:'stock',symbol:d.symbol,name:d.name,qty,buyPrice:d.price,dividend:d.dividend});log(`${d.name} を ${qty}株・${usd(price)} で購入。月配当 +${usd(qty*d.dividend)}。`);toast('株式を購入しました')}else{if(state.money<d.down){toast('頭金が不足しています。銀行から借入できます');return}state.money=roundAsset(state.money-d.down);state.assets.push({id:'a'+Date.now()+Math.random().toString(36).slice(2,6),type:d.type,sector:d.sector,name:d.name,cost:d.cost,down:d.down,mortgage:d.cost-d.down,originalMortgage:d.cost-d.down,vacancy:0,slump:0,cf:d.cf});log(`${d.name} の頭金 ${usd(d.down)} を支払い、月収益 ${usd(d.cf)} を追加。`);toast('資産を購入しました')}completeEvent()}
function borrow(){let v=Number(document.getElementById('loan-amount')?.value);if(!Number.isSafeInteger(v)||v<1000||v%1000){toast('$1,000単位で入力してください');return}if(v>10000000){toast('1回の借入上限は$10,000,000です');return}if(challenge()&&state.debts.bank+v>byId(state.profession,PROF).salary*4){toast('実戦モードの銀行借入限度額を超えています');return}state.debts.bank+=v;state.money+=v;log(`銀行から ${usd(v)} を借入。月の利息が ${usd(v*.1)} 増えた。`);saved();render();ui.panel='bank';renderOverlay();toast(`${usd(v)} 借りました。月支出 +${usd(v*.1)}`)}
function repayBank(){let v=Number(document.getElementById('repay-amount')?.value);if(!Number.isSafeInteger(v)||v<1000||v%1000){toast('$1,000単位で入力してください');return}if(v>state.debts.bank||v>state.money){toast('返済額が残高または現金を超えています');return}state.debts.bank-=v;state.money-=v;log(`銀行借入を ${usd(v)} 返済。月の利息が ${usd(v*.1)} 減った。`);refreshEscape();saved();render();ui.panel='bank';renderOverlay();toast('銀行ローンを返済しました')}
function repayDebt(id){if(!['home','school','car','card'].includes(id))return;let v=state.debts[id];if(!v||state.money<v)return;state.money-=v;state.debts[id]=0;log(`${{home:'住宅',school:'教育',car:'自動車',card:'カード'}[id]}ローンを全額 ${usd(v)} 返済。`);if(state.stage==='rat'&&income()>costs()&&!state.event)state.readyEscape=true;saved();render();ui.panel='bank';renderOverlay();toast('借金を完済しました')}
function promote(){if(!state.readyEscape||state.stage!=='rat')return;if(!canEscape()){state.readyEscape=false;saved();render();toast('現在は脱出条件を満たしていません');return}let p=income();state.ratSnapshot={passive:p,expenses:costs(),monthlyCashflow:cashflow(),assets:JSON.parse(JSON.stringify(state.assets)),debts:{...state.debts}};let first=Math.round(p/1000)*1000*100;state.stage='fast';state.pos=0;state.ftBase=first;state.money=first;state.assets=[];state.debts={home:0,school:0,car:0,card:0,bank:0};state.readyEscape=false;state.charityTurns=0;state.skipTurns=0;state.debts.bank=0;log(`上級ステージへ移動！ 不労所得の千ドル単位の四捨五入 × 100 = ${usd(first)} を初期収入として受け取った。`);ui.diceCount=2;ui.lastRoll=[];state.event={type:'notice',title:'上級ステージに到達！',body:`ラットレースを脱出しました。初期の収入日額は ${usd(first)}。上級ステージでは事業収入を月 $50,000 上乗せするか、選んだ夢を購入して勝利を目指します。`,extra:'ラットレースの資産・負債と現金は上級ステージ用に切り替わりました。'};saved();render()}
function checkWin(){if(state.stage!=='fast')return;let additional=ftFlow()-state.ftBase;if(additional>=50000){state.wonReason=`上級ステージで月間の事業収入を ${usd(additional)} 増やしました。お金を生む仕組みを育てた勝利です！`;state.event=null;ui.page='won';log('上級ステージの月間事業収入が $50,000 以上増え、勝利した。')}}
function sellMarket(id){
  const card=state.event?.card;
  const idx=state.assets.findIndex(x=>x.id===id);
  if(!card||idx<0)return;
  const a=state.assets[idx];
  if(card.type==='stock'&&a.type!=='stock')return;
  if(card.type==='realestate'&&(a.type!=='property'||(card.sector!=='all'&&a.sector!==card.sector)))return;
  if(card.type==='business'&&a.type!=='business')return;
  const qty=a.type==='stock'?Number(document.getElementById('sale-'+id)?.value):0;
  if(a.type==='stock'&&(!Number.isInteger(qty)||qty<1||qty>a.qty)){
    toast('保有株数の範囲内で売却株数を指定してください');return;
  }
  const sold=a.type==='stock'?roundAsset(Math.max(.01,roundAsset(a.buyPrice*card.multiple))*qty):Math.round(a.cost*card.multiple)-a.mortgage;
  if(state.money+sold<0){toast('売却時の不足金を払えません');return;}
  state.money=roundAsset(state.money+sold);
  if(a.type==='stock'){a.qty-=qty;if(a.qty===0)state.assets.splice(idx,1)}
  else state.assets.splice(idx,1);
  log(`${a.name} を${a.type==='stock'?qty+'株':''}売却。現金の増減 ${usd(sold)}。${a.type==='stock'&&a.qty>0?'残りの株式は保有継続。':'保有分の毎月の収入も終了。'}`);
  saved();render();toast('売却処理が完了しました');
}
function dismiss(){completeEvent()}
function action(e){let el=e.target.closest('[data-action]');if(!el)return;let a=el.dataset.action;switch(a){
case'home':ui.page='home';ui.panel=null;render();break;

case'tutorial-back':if(ui.step===0){ui.page='home'}else{ui.step--;ui.practice=''}render();break;
case'practice':ui.practice=el.dataset.answer;render();break;
case'setup':ui.page='setup';ui.panel=null;render();break;
case'select-prof':ui.profession=el.dataset.id;render();break;
case'select-dream':ui.dream=el.dataset.id;render();break;

case'new-game':if(state&&!confirm('保存済みのゲームを上書きして新しく開始しますか？'))break;newGame();break;
case'resume':state=getSaved();if(state){ui.page=state.wonReason?'won':'playing';ui.diceCount=state.stage==='fast'?2:1;ui.panel=null;render()}break;
case'rules':case'finance':case'bank':case'logs':case'menu':if((a==='finance'||a==='bank'||a==='logs')&&!state)break;openPanel(a);break;
case'close-panel':closePanel();break;
case'dice-count':ui.diceCount=Number(el.dataset.num);render();break;

case'show-event':renderOverlay();break;

case'buy-deal':buyDeal();break;
case'dismiss-event':dismiss();break;
case'pay-bill':{let ev=state.event;if(ev?.type!=='bill')break;payMandatory(ev.amount,ev.name);completeEvent();break}
case'donate':{let cost=Math.round(total()*.1);if(state.money>=cost){state.money-=cost;state.charityTurns=3;log(`寄付で ${usd(cost)} を支払い、3手番の追加サイコロ権を得た。`);completeEvent();toast('3ターン、サイコロ2個も選べます')}break}
case'borrow':borrow();break;

case'repay-property':repayProperty(el.dataset.id);break;
case'promote':promote();break;
case'sell-market':sellMarket(el.dataset.id);break;
case'buy-fast':{let ev=state.event;if(ev?.type!=='fastbiz')break;let b=FAST[ev.index];if(state.money<b.cost||state.ftBusinesses.includes(ev.index))break;state.money-=b.cost;state.ftBusinesses.push(ev.index);log(`${b.title} に ${usd(b.cost)} 投資。上級の収入 +${usd(b.cf)}。`);state.event=null;checkWin();saved();render();toast('事業を取得しました');break}
case'buy-dream':{let ev=state.event;if(ev?.type!=='dream')break;let d=byId(ev.dream,DREAMS);if(!d||state.money<d.price||state.ownedDreams.includes(d.id))break;state.money-=d.price;state.ownedDreams.push(d.id);log(`${d.name} を ${usd(d.price)} で実現した。`);state.event=null;if(d.id===state.dream){state.wonReason=`自分で選んだ夢「${d.name}」を ${usd(d.price)} で購入しました。`;ui.page='won'}saved();render();toast('夢を購入しました');break}
case'fast-donate':if(!state.ftDice3&&state.money>=100000){state.money-=100000;state.ftDice3=true;log('寄付 $100,000 で以降サイコロを3個まで選べるようになった。');completeEvent();toast('サイコロ3個まで使えます')}break;
case'restart':if(confirm('保存している現在のゲームを削除しますか？ この操作は元に戻せません。')){localStorage.removeItem(KEY);state=null;ui.page='setup';ui.panel=null;render()}break;
default:break}}
document.addEventListener('click',action);
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.panel)closePanel()});
render();
</script></body></html>
